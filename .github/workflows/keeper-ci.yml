# Keeper Worker CI. Installs, typechecks, tests, and bundles the deployment
# with `wrangler deploy --dry-run`; tests the wallet script.
#
# It never runs a keeper cycle: Cloudflare Cron Triggers are the only
# scheduler, and deploys are by hand (RELEASING.md Part C). Nothing here needs
# Cloudflare credentials either — a dry run bundles locally — so it runs the
# same on pull requests from forks.

name: keeper-ci

permissions: {}

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Keeper Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/keeper
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # pnpm from package.json's `packageManager`, Node from its
      # `devEngines.runtime`, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          working-directory: services/keeper
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is generated from wrangler.jsonc and
      # committed. Stale, it types the Worker against bindings that no longer
      # exist.
      - name: Generated types are current
        run: pnpm check:types

      - name: Typecheck
        run: pnpm typecheck

      # Includes test/config.test.ts, which validates each deployment in
      # wrangler.jsonc against the Worker's own config rules — the part a dry
      # run does not check.
      - name: Test
        run: pnpm test

      - name: Bundle the deployment
        run: pnpm check:deploy

      - name: Wallet script tests
        run: python3 -m unittest discover -s scripts/tests -v
