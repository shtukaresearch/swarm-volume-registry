# Keeper CI. Installs, typechecks, tests, and bundles both deployments for
# both platforms: `wrangler deploy --dry-run` for Cloudflare, the Lambda
# bundle plus each stack's template, linted with cfn-lint, for AWS.
#
# It never runs a keeper cycle: the platforms' schedulers are the only ones.
# Nothing here needs cloud credentials either — both checks run locally — so
# it runs the same on pull requests from forks.

name: keeper-ci

permissions: {}

on:
  pull_request:
  push:
    branches: [main]
  # keeper-deploy.yml runs this as its gate, so nothing ships untested.
  workflow_call:

jobs:
  check:
    name: Keeper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/keeper
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # pnpm from package.json's `packageManager`, Node from its
      # `devEngines.runtime`, then `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          working-directory: services/keeper
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is generated from wrangler.jsonc and
      # committed. Stale, it types the Worker against bindings that no longer
      # exist.
      - name: Generated types are current
        run: pnpm check:types

      - name: Typecheck
        run: pnpm typecheck

      # Includes test/config.test.ts, which validates each deployment in
      # wrangler.jsonc against the Worker's own config rules — the part a dry
      # run does not check — and test/aws.test.ts, which checks the AWS stacks
      # rendered from it.
      - name: Test
        run: pnpm test

      - name: Bundle both deployments (Cloudflare)
        run: pnpm check:deploy

      - name: Install cfn-lint
        run: pipx install cfn-lint==1.57.2

      # Both stacks' templates, and infra/github-oidc.yaml, against
      # CloudFormation's resource schemas.
      - name: Bundle and lint both stacks (AWS)
        run: pnpm check:aws
