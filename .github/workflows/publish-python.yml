name: Publish Python package

# Builds the ethswarm-volumes package (services/indexer) and publishes it to
# PyPI when a change under services/indexer/ lands on main (i.e. a merged PR).
# The publish job is gated on indexer-ci.yml — lint plus the full suite,
# integration tiers included — so a publish cannot happen unless it passes.
#
# Uploads are idempotent: skip-existing means merges that do not bump the
# version in services/indexer/pyproject.toml are no-ops rather than failures,
# so publishing only actually happens on the merge that raises the version.
#
# The filename is part of PyPI's trusted-publisher configuration; renaming it
# requires updating the publisher on PyPI to match.

on:
  push:
    branches: [main]
    paths:
      - 'services/indexer/**'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/indexer-ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ethswarm-volumes/
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    defaults:
      run:
        working-directory: services/indexer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: services/indexer/dist/
          skip-existing: true
