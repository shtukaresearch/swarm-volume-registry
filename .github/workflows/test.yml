name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint deploy tooling
        run: |
          uvx ruff@0.15.8 check script
          uvx ruff@0.15.8 format --check script

      - name: Test deployment manifest exporter
        run: python3 -m unittest discover -s script/tests -v

      - name: Run Forge tests
        run: forge test -vvv

  immutable-facts:
    # A deployment record and the broadcast it cites are facts: once committed they are
    # never changed or removed (RELEASING.md A3). Adding new ones is fine. Excluded:
    # run-latest.json, which Forge rewrites on every broadcast, and each network's latest
    # pointer deployments/<network>/VolumeRegistry.json, which A4 moves by design.
    name: Immutable deployment facts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Committed broadcasts and deployment records are unchanged
        env:
          # A pull request is checked out as its merge into the base, so diffing from the
          # base tip gives exactly the PR's changes. A push is diffed from the previous tip.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare against (new branch or rewritten history); skipping."
            exit 0
          fi
          changed=$(git diff --no-renames --diff-filter=DMT --name-only "$BASE" HEAD -- \
            'contracts/broadcast/**' 'contracts/deployments/*/*-v*.json' \
            ':(exclude,glob)contracts/broadcast/**/run-latest.json')
          if [ -n "$changed" ]; then
            echo "::error::Committed deployment facts were modified or deleted:"
            echo "$changed"
            exit 1
          fi
