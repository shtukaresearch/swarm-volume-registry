[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = true
# Every compiler input that reaches the contract metadata is pinned here, so the
# metadata hash in the bytecode (and hence a CREATE2 address) depends only on the
# commit, not on the Foundry version or which nested submodules are checked out.
# Auto-detected remappings vary with the latter (an initialised
# lib/openzeppelin-contracts/lib/forge-std adds ds-test/), so they are off and
# remappings.txt is the complete list.
auto_detect_remappings = false
evm_version = "paris"
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
