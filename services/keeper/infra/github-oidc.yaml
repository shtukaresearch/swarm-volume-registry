# One-time AWS setup for the keeper, deployed once per account and region by
# an administrator, before the first `pnpm aws deploy`:
#
#   aws cloudformation deploy --stack-name keeper-bootstrap \
#     --template-file infra/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubRepository=<owner>/<repo>
#
# It creates:
#   - keeper-permissions-boundary: the most any role template.yaml creates
#     may do. template.yaml sets it on every role, so it must exist first.
#   - github-deploy-keeper: the role .github/workflows/keeper-deploy.yml
#     assumes through GitHub OIDC, from the `sepolia` and `gnosis` Environments
#     only. No AWS key is stored in GitHub. Deliberately not named keeper-*,
#     the roles it manages, so it cannot edit its own trust or policies.
#
# The deploy role can manage only keeper-* resources, and can create IAM
# roles only under the boundary, so it cannot grant itself or a function more
# than the boundary allows. It never reads a secret: it can list SSM
# parameter names, not decrypt their values.

AWSTemplateFormatVersion: "2010-09-09"
Description: Swarm VolumeRegistry keeper — GitHub deploy role and permissions boundary

Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/repo allowed to deploy.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: There is one GitHub OIDC provider per account. Set false if the account already has it.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # What the keeper's functions and schedules need, and nothing more.
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: keeper-permissions-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/keeper-*
          - Sid: ReadKeeperSecrets
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/keeper-*
          - Sid: ScheduleInvokesKeeper
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:keeper-*
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:keeper-*:*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-keeper
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:sepolia
                  - !Sub repo:${GitHubRepository}:environment:gnosis
      Policies:
        - PolicyName: keeper-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/keeper-*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: StacksReadOnly
                Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate, cloudformation:ListStacks]
                Resource: "*"
              # `sam deploy --resolve-s3` uploads the bundle here, creating the
              # bucket through the aws-sam-cli-managed-default stack once.
              - Sid: SamArtifacts
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:keeper-*
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:keeper-*:*
              - Sid: Schedules
                Effect: Allow
                Action: scheduler:*
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/keeper-*
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/keeper-*
              - Sid: LogGroupsReadOnly
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Alarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource, cloudwatch:UntagResource]
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:keeper-*
              - Sid: AlarmsReadOnly
                Effect: Allow
                Action: [cloudwatch:DescribeAlarms, cloudwatch:ListTagsForResource]
                Resource: "*"
              - Sid: AlarmTopics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:keeper-*
              # scripts/aws.ts checks the secrets exist before deploying. Names
              # only: no ssm:GetParameter*, no kms:Decrypt.
              - Sid: SecretNames
                Effect: Allow
                Action: ssm:DescribeParameters
                Resource: "*"
              - Sid: RolesReadAndDelete
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/keeper-*
              # Any role it creates or grants to carries the boundary, so it
              # can never grant more than the boundary allows.
              - Sid: RolesUnderBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/keeper-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref PermissionsBoundary
              - Sid: PassRolesToKeeper
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/keeper-*
                Condition:
                  StringEquals:
                    iam:PassedToService: [lambda.amazonaws.com, scheduler.amazonaws.com]
              - Sid: KeepTheBoundary
                Effect: Deny
                Action: [iam:DeleteRolePermissionsBoundary, iam:CreatePolicyVersion, iam:DeletePolicy, iam:SetDefaultPolicyVersion]
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
                  - !Ref PermissionsBoundary

Outputs:
  DeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  PermissionsBoundaryArn:
    Value: !Ref PermissionsBoundary
