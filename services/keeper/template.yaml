# The keeper on AWS: one stack per wrangler env, named like its Worker
# (keeper-sepolia, keeper-gnosis). Deploy with `pnpm aws deploy <env>`
# (scripts/aws.ts), which derives every parameter below without a default from
# wrangler.jsonc — do not pass them by hand.
#
# The code is the Worker's, behind src/aws/handler.ts:
#   keeper        EventBridge Scheduler → index.scheduled → worker.scheduled
#   keeper-health Function URL          → index.health    → worker.fetch
#
# Secrets are SSM SecureStrings under /<DeploymentName>/, one per name in the
# env's `secrets.required`. They are never stack parameters.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Swarm VolumeRegistry keeper

Parameters:
  DeploymentName:
    Type: String
    AllowedPattern: "^[a-z0-9-]+$"
    Description: The Worker's name in wrangler.jsonc. Names the stack, both functions and the SSM path.
  KeeperVars:
    Type: String
    Description: The env's `vars` from wrangler.jsonc, as JSON.
  KeeperSecrets:
    Type: String
    Description: The env's `secrets.required`, comma-separated. Read from SSM under /<DeploymentName>/.
  Cron:
    Type: String
    Description: The env's wrangler cron, as each run reports it.
  ScheduleExpression:
    Type: String
    Description: The same schedule as an EventBridge Scheduler expression.
  TimeoutSeconds:
    Type: Number
    MinValue: 1
    MaxValue: 900
    Description: The cron interval, capped at Lambda's 15 minutes, so two runs can never overlap.
  IntervalSeconds:
    Type: Number
    MinValue: 60
    Description: Seconds between runs, for the not-running alarm.
  ScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Description: DISABLED (`pnpm aws deploy <env> --paused`) stops the runs, and the not-running alarm with them.
  MemorySize:
    Type: Number
    Default: 256
  LogRetentionDays:
    Type: Number
    Default: 30

Conditions:
  Scheduled: !Equals [!Ref ScheduleState, ENABLED]

Globals:
  Function:
    # From infra/github-oidc.yaml, which must be deployed first. The deploy
    # role can create roles only under it.
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/keeper-permissions-boundary
    CodeUri: dist/aws
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: !Ref MemorySize
    Environment:
      Variables:
        KEEPER_VARS: !Ref KeeperVars
        KEEPER_SECRETS: !Ref KeeperSecrets
        KEEPER_SECRETS_PATH: !Sub /${DeploymentName}/
        NODE_OPTIONS: --enable-source-maps

Resources:
  # --- the keeper -----------------------------------------------------------

  KeeperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DeploymentName}
      RetentionInDays: !Ref LogRetentionDays

  KeeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref DeploymentName
      Description: !Sub "${DeploymentName}: one keeper cycle per scheduled run"
      Handler: index.scheduled
      Timeout: !Ref TimeoutSeconds
      # One run at a time: runs share the wallet, and an overlapping run would
      # race it for nonces (docs/KEEPERS.md).
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref KeeperLogGroup
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${DeploymentName}/*
      # The Worker's noRetry(): the next tick is the retry. A queued tick that
      # cannot start within a minute — its predecessor still running — is
      # dropped rather than run late.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            Name: !Ref DeploymentName
            PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/keeper-permissions-boundary
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: UTC
            State: !Ref ScheduleState
            FlexibleTimeWindow:
              Mode: "OFF"
            Input: !Sub '{"cron":"${Cron}","scheduledTime":"<aws.scheduler.scheduled-time>"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 60

  # --- GET /health ------------------------------------------------------------

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DeploymentName}-health
      RetentionInDays: !Ref LogRetentionDays

  # Its own function, so traffic on the public URL can never take the keeper's
  # one concurrent run. SAM grants the public URL both lambda:InvokeFunctionUrl
  # and — required since October 2025 — lambda:InvokeFunction, the latter only
  # through the URL.
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${DeploymentName}-health
      Description: !Sub "${DeploymentName}: GET /health, the wallet to fund"
      Handler: index.health
      Timeout: 10
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref HealthLogGroup
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${DeploymentName}/*
      FunctionUrlConfig:
        AuthType: NONE

  # --- alarms -------------------------------------------------------------------
  #
  # For what Telegram cannot report: a run that never got as far as reading its
  # alert channel, or a schedule that stopped firing. Subscribe to the topic
  # once (README); subscriptions are not part of the stack, so a redeploy
  # keeps them.

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${DeploymentName}-alarms

  # Every failed run, including those Telegram already reported.
  RunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${DeploymentName}-run-failed
      AlarmDescription: !Sub "${DeploymentName}: a keeper run failed. Its report is in /aws/lambda/${DeploymentName}."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref KeeperFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A tick that found the previous run still going. Should never happen while
  # each run fits inside its interval.
  RunOverlapAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${DeploymentName}-run-overlap
      AlarmDescription: !Sub "${DeploymentName}: a scheduled run was throttled behind the previous one."
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref KeeperFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Three intervals without a single run: the schedule is not firing.
  NotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${DeploymentName}-not-running
      AlarmDescription: !Sub "${DeploymentName}: no keeper run in three scheduled intervals."
      ActionsEnabled: !If [Scheduled, true, false]
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref KeeperFunction
      Statistic: Sum
      Period: !Ref IntervalSeconds
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

Outputs:
  HealthUrl:
    Description: GET <url>health returns the wallet to fund.
    Value: !GetAtt HealthFunctionUrl.FunctionUrl
  KeeperFunction:
    Value: !Ref KeeperFunction
  SecretsPath:
    Description: SSM path the secrets are read from.
    Value: !Sub /${DeploymentName}/
  AlarmTopic:
    Description: Subscribe to this for the CloudWatch alarms.
    Value: !Ref AlarmTopic
